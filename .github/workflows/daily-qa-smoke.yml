name: Daily QA — Smoke Loop

on:
  schedule:
    # 13:00 UTC daily
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-qa-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run public smoke loops
        id: smoke
        continue-on-error: true
        run: node scripts/qa-smoke-report.mjs https://campaignos-sigma.vercel.app --loops=3

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: qa-smoke-report
          path: qa/daily/
          if-no-files-found: error

      - name: Commit report to branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          BRANCH="cursor/qa-daily-smoke-${DATE}-f25a"
          git config user.name "campaignos-qa[bot]"
          git config user.email "campaignos-qa[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add qa/daily/
          if git diff --cached --quiet; then
            echo "No report changes to commit"
            exit 0
          fi
          git commit -m "qa: daily smoke ${DATE}"
          git push -u origin "$BRANCH" --force
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq 'length')
          if [[ "$EXISTING" == "0" ]]; then
            gh pr create --draft \
              --title "qa: daily smoke ${DATE}" \
              --body "Automated daily smoke report for ${DATE}. Hands off to Daily QA — Issue Logger." \
              --base main || true
          else
            echo "PR already exists for ${BRANCH}"
          fi

      - name: Fail job if smoke found defects
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke completed with findings (report uploaded + branch pushed)."
          exit 1
