name: Automation QA finding
description: Structured bug from the daily smoke / issue logger loop
title: "[QA] medium — short title"
labels: ["automation:qa"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
      default: 2
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Area
      description: Route or module (e.g. /dashboard, auth, brain)
      placeholder: /dashboard
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Repro
      description: Exact steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, curl snippets, console errors, report path
  - type: input
    id: finding_id
    attributes:
      label: Finding id
      description: From findings.json (optional for hand-filed issues)
      placeholder: smoke-dashboard-500
  - type: dropdown
    id: autofix
    attributes:
      label: Autofix candidate?
      options:
        - "no"
        - "yes"
      default: 0
  - type: markdown
    attributes:
      value: |
        After filing, add label `autofix-candidate` only if a small high-confidence fix is appropriate.
        Add `needs-human` if product judgment is required.
